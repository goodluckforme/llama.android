[versions]
# Plugins
agp = "8.3.2"
kotlin = "1.9.20"  # 降级：原为 2.3.0 → 改为 1.9.20（AGP 8.3 官方推荐）

# AndroidX
activity = "1.8.0"         # 原 1.12.2 → 降级
appcompat = "1.6.1"        # 原 1.7.1 → 降级
core-ktx = "1.12.0"        # 原 1.17.0 → 降级（1.13+ 需 Kotlin 2.0+）
constraint-layout = "2.1.4" # 原 2.2.1 → 降级
datastore-preferences = "1.0.0" # 原 1.2.0 → 降级（1.0.0 稳定且广泛兼容）

# Material
material = "1.10.0"        # 原 1.13.0 → 降级（1.11+ 开始要求更高 AndroidX）

# Testing
espresso-core = "3.5.1"    # 原 3.7.0 → 降级
androidx-junit = "1.1.5"   # 原 1.3.0 → 降级
junit = "4.13.2"           # 保持不变（已是经典稳定版）


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }


[libraries]

# AndroidX
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraint-layout" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore-preferences" }

#Material
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Testing
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-junit" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[bundles]
androidx = [
    "androidx-activity",
    "androidx-appcompat",
    "androidx-constraintlayout",
    "androidx-core-ktx",
    "androidx-datastore-preferences",
]
